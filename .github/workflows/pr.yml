name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-title:
    name: Validate PR Title
    runs-on: ubuntu-latest
    steps:
      - name: Check Conventional Commits format
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert

  build-and-test:
    name: Build & Test
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: '6.x'

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3

      - name: Display version
        run: |
          echo "## Version: ${{ steps.gitversion.outputs.fullSemVer }}" >> $GITHUB_STEP_SUMMARY

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: nuget-

      - name: Restore
        run: dotnet restore src/YAF.slnx

      - name: Build
        run: >-
          dotnet build src/YAF.slnx -c Release --no-restore
          /p:Version=${{ steps.gitversion.outputs.fullSemVer }}
          /p:AssemblyVersion=${{ steps.gitversion.outputs.assemblySemVer }}
          /p:FileVersion=${{ steps.gitversion.outputs.assemblySemFileVer }}
          /p:InformationalVersion=${{ steps.gitversion.outputs.informationalVersion }}

      - name: Test with coverage
        run: >-
          dotnet test src/YAF.slnx
          -c Release
          --no-build
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage

      - name: Generate coverage report
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: coverage/**/coverage.cobertura.xml
          targetdir: coverage/report
          reporttypes: HtmlInline;TextSummary;Cobertura

      - name: Display coverage summary
        run: cat coverage/report/Summary.txt

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/report
          retention-days: 14

      - name: Post coverage comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage
          path: coverage/report/Summary.txt

      - name: Check formatting
        run: dotnet format src/YAF.slnx --verify-no-changes
